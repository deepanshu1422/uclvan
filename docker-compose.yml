# `docker compose up --build`           -> production-like single container on http://localhost:8000
# `docker compose --profile dev up`     -> hot-reload backend (:8001) + Vite dev server (http://localhost:5173)
services:
  app:
    build: .
    ports: ["8000:8000"]

  api-dev:
    profiles: ["dev"]
    image: python:3.12-slim
    working_dir: /app
    volumes: ["./backend:/app"]
    command: sh -c "pip install -q -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports: ["8001:8000"]

  web-dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /web
    volumes: ["./frontend:/web", "/web/node_modules"]
    environment: { API_PROXY: "http://api-dev:8000" }
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 5173"
    ports: ["5173:5173"]
    depends_on: [api-dev]
